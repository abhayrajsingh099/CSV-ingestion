services:
    api: &api
      build:
        context: .
        dockerfile: ./docker/local/django/Dockerfile
      volumes:
        - .:/app:z
        - ./staticfiles:/app/staticfiles
      ports:
       - "8000:8000"
      env_file:
       - .envs/.env.local
      depends_on:
       - mysqldb
       - redis
      command: /start.sh
      networks:
       - csv_ingestion_nw

    mysqldb:
        image: mysql:8.4
        volumes:
            - csv_ingestion_local_db:/var/lib/mysql
        env_file:
            - .envs/.env.local
        networks:
            - csv_ingestion_nw

    redis:
        image: redis:7-alpine
        networks:
            - csv_ingestion_nw

    celeryworker:
        <<: *api
        command: celery -A app.core.celery:app worker -l INFO
        ports: []

networks:
  csv_ingestion_nw:
    driver: bridge

volumes:
  csv_ingestion_local_db:
